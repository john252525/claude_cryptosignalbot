<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Signal Aggregator{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0f1217; --panel: #161b22; --border: #2d333b;
      --text: #e6edf3; --muted: #8b949e;
      --green: #3fb950; --red: #f85149; --amber: #d29922; --blue: #58a6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           background: var(--bg); color: var(--text); }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header nav a { color: var(--muted); text-decoration: none; margin-right: 16px; font-size: 14px; }
    header nav a:hover, header nav a.active { color: var(--text); }
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .stat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .pos { color: var(--green); } .neg { color: var(--red); } .neutral { color: var(--muted); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500;
             background: var(--border); color: var(--text); }
    .badge.LONG, .badge.CLOSED_TP { background: rgba(63,185,80,0.18); color: var(--green); }
    .badge.SHORT, .badge.CLOSED_SL { background: rgba(248,81,73,0.18); color: var(--red); }
    .badge.PENDING { background: rgba(88,166,255,0.18); color: var(--blue); }
    .badge.ACTIVE { background: rgba(210,153,34,0.18); color: var(--amber); }
    .badge.EXPIRED, .badge.INVALID { background: rgba(139,148,158,0.18); color: var(--muted); }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filters select, .filters input, .filters button {
      background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px;
    }
    button { cursor: pointer; }
    .raw { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
<header>
  <h1>Signal Aggregator</h1>
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Dashboard</a>
    <a href="/channels" {% if request.url.path == '/channels' %}class="active"{% endif %}>Channels</a>
    <a href="/signals" {% if request.url.path.startswith('/signals') %}class="active"{% endif %}>Signals</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
