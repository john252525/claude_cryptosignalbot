name: Deploy to VPS

on:
  push:
    branches:
      - claude/trading-signal-aggregator-mvp-DPRwx

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            bash /root/claude_cryptosignalbot/deploy/deploy.sh ${{ github.ref_name }}
